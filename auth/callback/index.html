<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <title>Verifying Email · Qalamly</title>
  <link rel="stylesheet" href="/css/styles.css" onerror="this.href='../../css/styles.css'">
  <link rel="icon" type="image/png" href="/logo/icon.png">
  <script src="/js/supabase.js" onerror="var s=document.createElement('script');s.src='../../js/supabase.js';document.head.appendChild(s);"></script>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7fb;
      margin: 0;
      padding: 20px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .callback-card {
      width: min(460px, 100%);
      background: #ffffff;
      border: 1px solid #e6e7f0;
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(32, 33, 57, 0.08);
      text-align: center;
    }
    .callback-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #f0edff;
      color: #7458e8;
      display: grid;
      place-items: center;
      font-size: 28px;
      margin: 0 auto 18px;
    }
    .callback-card h1 {
      font-size: 21px;
      margin: 0 0 10px;
      color: #202139;
    }
    .callback-card p {
      font-size: 13px;
      line-height: 1.6;
      color: #66687a;
      margin: 0 0 22px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e9e4ff;
      border-top-color: #7458e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .callback-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>
  <main class="callback-card" id="callbackCard">
    <div class="callback-icon" id="callbackIcon">🔐</div>
    <div class="spinner" id="callbackSpinner" aria-hidden="true"></div>
    <h1 id="callbackTitle">Confirming your email...</h1>
    <p id="callbackMessage">Exchanging your verification code for an active Qalamly session. Please wait a moment.</p>
    <div class="callback-actions" id="callbackActions" hidden></div>
  </main>

  <script>
    (async () => {
      "use strict";

      const iconEl = document.getElementById("callbackIcon");
      const spinnerEl = document.getElementById("callbackSpinner");
      const titleEl = document.getElementById("callbackTitle");
      const messageEl = document.getElementById("callbackMessage");
      const actionsEl = document.getElementById("callbackActions");

      // Resolve root path relative to /auth/callback
      const rootPath = window.location.pathname.replace(/\/auth\/callback\/?(index\.html)?$/i, "/");

      function showResult({ icon, title, message, primaryHref, primaryLabel, secondaryHref, secondaryLabel }) {
        if (spinnerEl) spinnerEl.style.display = "none";
        if (iconEl) iconEl.textContent = icon;
        if (titleEl) titleEl.textContent = title;
        if (messageEl) messageEl.textContent = message;
        if (actionsEl) {
          actionsEl.hidden = false;
          actionsEl.innerHTML = `
            ${primaryHref ? `<a class="primary-button" href="${primaryHref}" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;height:42px;">${primaryLabel}</a>` : ""}
            ${secondaryHref ? `<a class="secondary-button" href="${secondaryHref}" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;height:40px;">${secondaryLabel}</a>` : ""}
          `;
        }
      }

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.slice(1));
        const code = urlParams.get("code");
        const tokenHash = urlParams.get("token_hash");
        let type = urlParams.get("type") || hashParams.get("type") || "";
        const recoveryTarget = localStorage.getItem("qalamly.recovery_target") || "";
        const errorCode = urlParams.get("error_code") || hashParams.get("error_code") || "";
        const errorDesc = urlParams.get("error_description") || hashParams.get("error_description") || urlParams.get("error") || hashParams.get("error") || "";

        // Initialize Supabase client with NEXT_PUBLIC_SUPABASE_URL & NEXT_PUBLIC_SUPABASE_ANON_KEY
        async function initCallbackSupabaseClient() {
          if (typeof window.getSupabaseClient === "function") {
            return await window.getSupabaseClient();
          }
          let supabaseUrl = window.NEXT_PUBLIC_SUPABASE_URL || window.SUPABASE_URL || "https://xjdrqktoeodohyoynphg.supabase.co";
          let supabaseAnonKey = window.NEXT_PUBLIC_SUPABASE_ANON_KEY || window.SUPABASE_ANON_KEY || "sb_publishable_LzIX4TdfqXDldsfjnsO8sQ_zYs4di_B";
          try {
            const cfgRes = await fetch("/api/config", { cache: "no-store" });
            if (cfgRes.ok) {
              const cfg = await cfgRes.json();
              supabaseUrl = cfg.NEXT_PUBLIC_SUPABASE_URL || cfg.supabaseUrl || supabaseUrl;
              supabaseAnonKey = cfg.NEXT_PUBLIC_SUPABASE_ANON_KEY || cfg.supabaseAnonKey || supabaseAnonKey;
            }
          } catch {}
          if (!window.supabase?.createClient) {
            await new Promise((resolve, reject) => {
              const s = document.createElement("script");
              s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
              s.onload = resolve;
              s.onerror = reject;
              document.head.appendChild(s);
            });
          }
          return window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
            global: { headers: { apikey: supabaseAnonKey } }
          });
        }

        const supabase = await initCallbackSupabaseClient();

        // Listen for PASSWORD_RECOVERY event during code exchange
        let isPasswordRecovery = type === "recovery" || Boolean(recoveryTarget);
        supabase.auth.onAuthStateChange((event) => {
          if (event === "PASSWORD_RECOVERY") {
            isPasswordRecovery = true;
          }
        });

        // Check if detectSessionInUrl already exchanged the code automatically
        let { data: sessionData } = await supabase.auth.getSession();

        // Exchange temporary code only if session wasn't already established by detectSessionInUrl
        if (!sessionData?.session && code) {
          const { data: exchData, error: exchError } = await supabase.auth.exchangeCodeForSession(code);
          if (exchData?.session) {
            sessionData = exchData;
          } else if (exchError) {
            const recheck = await supabase.auth.getSession();
            if (recheck.data?.session) {
              sessionData = recheck.data;
            } else if (!isPasswordRecovery) {
              throw exchError;
            }
          }
        } else if (!sessionData?.session && tokenHash && type) {
          const { data: otpData, error: otpError } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type
          });
          if (otpData?.session) {
            sessionData = otpData;
          } else if (otpError && !isPasswordRecovery) {
            throw otpError;
          }
        }

        // If Supabase returned otp_expired in URL params, still route recovery users to set their new password
        if (errorDesc && !sessionData?.session && !isPasswordRecovery) {
          if (errorCode === "otp_expired" || errorDesc.toLowerCase().includes("expired")) {
            showResult({
              icon: "🔑",
              title: "Link Already Used or Expired",
              message: "If you were resetting a password, click below to set your new password directly, or sign in if your email is already confirmed.",
              primaryHref: `${rootPath}login.html?type=recovery`,
              primaryLabel: "Reset Website Password →",
              secondaryHref: `${rootPath}admin.html?type=recovery`,
              secondaryLabel: "Reset Admin Studio Password →"
            });
            return;
          }
          throw new Error(decodeURIComponent(errorDesc.replace(/\+/g, " ")));
        }

        const user = sessionData?.session?.user || (await supabase.auth.getUser()).data?.user || null;

        if (isPasswordRecovery) {
          const targetPage = `${rootPath}update-password`;
          showResult({
            icon: "🔑",
            title: "Password Reset Verified",
            message: "Redirecting you to the Update Password page...",
            primaryHref: targetPage,
            primaryLabel: "Set New Password →"
          });
          setTimeout(() => {
            window.location.replace(targetPage);
          }, 500);
          return;
        }

        if (user) {
          const meta = user.user_metadata || {};
          const email = user.email || "";
          const fullName = meta.full_name || email.split("@")[0] || "Writer";
          const poeticName = meta.poetic_name || meta.peotic_name || fullName;
          const role = (meta.role || "both").toLowerCase();
          const cleanHandle = `${poeticName.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${user.id.slice(0, 6)}`;

          // Ensure user profile exists in public.profiles
          try {
            await supabase.from("profiles").upsert({
              id: user.id,
              full_name: fullName,
              peotic_name: poeticName,
              email,
              role: role === "admin" ? "both" : role,
              username: cleanHandle
            });
          } catch (profErr) {
            console.warn("Profile sync notice:", profErr);
          }

          // Sync local session storage so dashboard recognizes user immediately
          try {
            const rawUsers = localStorage.getItem("qalamly.users.v3");
            const list = rawUsers ? JSON.parse(rawUsers) : [];
            const newUser = {
              id: user.id,
              name: fullName,
              poeticName,
              email,
              role: role === "admin" ? "both" : role,
              handle: `@${cleanHandle}`,
              bio: "Writer and reader on Qalamly.",
              followers: 0,
              following: 0
            };
            const updatedList = [...(Array.isArray(list) ? list.filter((u) => u.id !== user.id) : []), newUser];
            localStorage.setItem("qalamly.users.v3", JSON.stringify(updatedList));
            localStorage.setItem("qalamly.session.v3", JSON.stringify(user.id));
          } catch (storageErr) {
            console.warn("Local storage sync notice:", storageErr);
          }

          // Check if this user registered as an Administrator
          const isAdminSetup = role === "admin" || urlParams.get("next") === "admin" || localStorage.getItem("qalamly.pending_admin_setup") === "1";
          if (isAdminSetup) {
            localStorage.removeItem("qalamly.pending_admin_setup");
            try {
              const { error: rpcErr } = await supabase.rpc("register_initial_admin", {
                admin_full_name: fullName
              });
              if (rpcErr) {
                await supabase.from("admins").insert({
                  id: user.id,
                  email: email.toLowerCase(),
                  full_name: fullName,
                  role: "super_admin",
                  is_active: true
                });
              }
            } catch (adminErr) {
              console.warn("Admin table registration notice:", adminErr);
            }

            showResult({
              icon: "✅",
              title: "Administrator Email Confirmed!",
              message: "Redirecting you to the Qalamly Admin Studio...",
              primaryHref: `${rootPath}admin.html`,
              primaryLabel: "Open Admin Studio →"
            });
            setTimeout(() => {
              window.location.replace(`${rootPath}admin.html`);
            }, 900);
            return;
          }

          // Standard user redirect to dashboard
          showResult({
            icon: "✅",
            title: "Email Confirmed!",
            message: "Your Qalamly account is now active. Redirecting to your dashboard...",
            primaryHref: `${rootPath}dashboard.html`,
            primaryLabel: "Go to Dashboard →"
          });
          setTimeout(() => {
            window.location.replace(`${rootPath}dashboard.html`);
          }, 900);
          return;
        }

        // If no session was returned (e.g. email was confirmed in another browser), send to login
        showResult({
          icon: "✅",
          title: "Email Verified!",
          message: "Your email address has been confirmed. You can now sign in to your account.",
          primaryHref: `${rootPath}login.html?type=email_confirmation`,
          primaryLabel: "Continue to Log In →",
          secondaryHref: `${rootPath}admin.html`,
          secondaryLabel: "Admin Studio Sign In"
        });
      } catch (err) {
        showResult({
          icon: "⚠️",
          title: "Verification Link Issue",
          message: err instanceof Error ? err.message : "This confirmation link is invalid or has expired. Please request a new confirmation email.",
          primaryHref: `${rootPath}login.html`,
          primaryLabel: "Go to Log In →",
          secondaryHref: `${rootPath}signup.html`,
          secondaryLabel: "Back to Sign Up"
        });
      }
    })();
  </script>
</body>
</html>
