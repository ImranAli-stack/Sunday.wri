<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Sunday community member profile.">
  <title>Community profile — Sunday</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body data-page="profile">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Sunday home">
      <span class="brand-mark" aria-hidden="true">s</span>
      <span>sunday<span class="brand-dot">.</span></span>
    </a>
    <nav class="top-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
      <a href="competitions.html">Competitions</a>
    </nav>
    <div class="topbar-spacer"></div>
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
      <input id="searchInput" type="search" placeholder="Search stories..." aria-label="Search stories">
    </label>
    <a class="write-button" id="writeLink" href="write.html">Write</a>
    <a class="auth-link" id="authLink" href="login.html">Log in</a>
    <div class="header-profile" id="headerProfile" hidden>
      <span class="avatar purple" id="headerAvatar">?</span>
      <span class="header-profile-copy">
        <a class="header-profile-name" id="headerName" href="dashboard.html">Writer</a>
        <span class="header-profile-stats" id="headerStats" aria-label="Profile statistics">
          <a href="dashboard.html#userStories"><strong data-header-stories>0</strong> stories</a>
          <a href="dashboard.html#userFollowers"><strong data-header-followers>—</strong> followers</a>
          <a href="dashboard.html#userFollowing"><strong data-header-following>—</strong> following</a>
        </span>
      </span>
    </div>
  </header>
  <div class="layout content-only">
    <main class="feed"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
